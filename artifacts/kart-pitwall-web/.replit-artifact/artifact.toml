kind = "web"
previewPath = "/"
title = "Pit Wall Streamlit"
description = "Dashboard Streamlit per la strategia ai box nelle gare Go-Kart Endurance, servita dal progetto Python esistente."
version = "1.0.0"
id = "artifacts/kart-pitwall-web"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 25630

[services.development]
run = "cd ../.. && streamlit run --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableWebsocketCompression false --server.port $PORT main.py"

[services.production]

[services.production.build]
args = ["python", "-m", "pip", "install", "-r", "requirements.txt"]

[services.production.run]
args = ["streamlit", "run", "--server.address", "0.0.0.0", "--server.headless", "true", "--server.enableCORS", "false", "--server.enableWebsocketCompression", "false", "--server.port", "25630", "main.py"]

[services.production.run.env]
PORT = "25630"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "25630"
BASE_PATH = "/"
